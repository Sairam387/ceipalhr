# =========================================================
# Server
# =========================================================

server.port=8081


# =========================================================
# PostgreSQL Database
# =========================================================

spring.datasource.url=jdbc:postgresql://localhost:5433/smarthr

spring.datasource.username=postgres

spring.datasource.password=1234

spring.datasource.driver-class-name=org.postgresql.Driver


# =========================================================
# JPA / Hibernate
# =========================================================

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=false

spring.jpa.properties.hibernate.format_sql=true


# =========================================================
# Gmail SMTP - Phase 1
# =========================================================

spring.mail.host=smtp.gmail.com

spring.mail.port=587

spring.mail.username=sairamtalari053@gmail.com

spring.mail.password=pnqmusczkfysliiq

spring.mail.properties.mail.smtp.auth=true

spring.mail.properties.mail.smtp.starttls.enable=true

spring.mail.properties.mail.smtp.starttls.required=true

spring.mail.properties.mail.smtp.connectiontimeout=5000

spring.mail.properties.mail.smtp.timeout=5000

spring.mail.properties.mail.smtp.writetimeout=5000


# =========================================================
# SmartHR Phase 1 Test Mode
# =========================================================

smarthr.mail.test-mode=${SMART_HR_MAIL_TEST_MODE:true}

# Default test recipient
# Environment variable can override this value

smarthr.mail.test-recipient=${SMART_HR_TEST_RECIPIENT:sairamtalari053@gmail.com}
